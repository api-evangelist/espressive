name: Espressive
description: >-
  Espressive is an enterprise conversational-AI company whose flagship product,
  Barista, is a GenAI-based virtual support agent that automates the resolution
  of employee questions, issues, and requests across IT service management (ITSM),
  HR, and other internal help desks. Barista connects natural-language employee
  requests to automation by integrating with any REST-API-enabled third-party
  system (ServiceNow, Jira, Slack, Teams, Okta, Workday, Microsoft 365) via its
  Integration Designer and Barista Integration Marketplace, and reports employee
  adoption rates of 80-85% with 50-70% reductions in help-desk call volume.
  Espressive was acquired by Resolve (resolve.io) in September 2025 and folded into
  Resolve's agentic automation and orchestration platform; the standalone
  www.espressive.com surface now redirects to resolve.io. Espressive exposes no
  public developer API of its own -- Barista is a consumer of customer REST APIs,
  and product/developer documentation sits behind the Espressive support portal.
